name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install 1.93.0 --profile minimal --component rustfmt --component clippy
      - name: Format
        run: cargo +1.93.0 fmt --check
      - name: Test
        run: cargo +1.93.0 test --locked
      - name: Clippy
        run: cargo +1.93.0 clippy --locked --all-targets -- -D warnings
